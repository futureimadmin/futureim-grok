fleets:
- fleet_id: core_banking
  name: Core Banking
  description: 'Demand deposits, savings, term deposits, and related payment rails on BIAN account and payment domains.'
  icon: "🏛️"
  status: active
  platform: bian
  bian_version: "12"
  is_reference: false
  reference_fleet_id: bian
  default_top_k: 8
  system_prompt_hint: Align to BIAN current/savings/term deposit and payment order/execution boundaries.
  documents_prefix: fleets/core_banking/
  tiers:
  - tier_id: deposits
    name: Deposits
    description: Account products
    rack_ids: [current_accounts, savings, term_deposits]
    bian_service_domains: [Current Account, Savings Account, Term Deposit, Position Keeping]
  - tier_id: payments
    name: Payments
    description: Payment initiation and execution
    rack_ids: [payments]
    bian_service_domains: [Payment Order, Payment Execution, Standing Order, Direct Debit Mandate]
  racks:
  - rack_id: current_accounts
    name: Current Accounts
    description: Demand deposit facilities
    bian_service_domains: [Current Account, Position Keeping]
    tier_ids: [deposits]
  - rack_id: savings
    name: Savings Accounts
    description: Interest-bearing savings
    bian_service_domains: [Savings Account]
    tier_ids: [deposits]
  - rack_id: term_deposits
    name: Term Deposits
    description: Fixed-term deposits
    bian_service_domains: [Term Deposit]
    tier_ids: [deposits]
  - rack_id: payments
    name: Payments
    description: Orders and execution
    bian_service_domains: [Payment Order, Payment Execution, Standing Order, Direct Debit Mandate]
    tier_ids: [payments]

fleets:
- fleet_id: corporate_lending
  name: Corporate Lending
  description: 'Commercial and corporate credit — facilities, syndicated loans, project finance, and limit/exposure management on the BIAN platform.'
  icon: "🏦"
  status: active
  platform: bian
  bian_version: "12"
  is_reference: false
  reference_fleet_id: bian
  default_top_k: 8
  system_prompt_hint: Use BIAN corporate lending structure; keep bank credit policy in product sources.
  documents_prefix: fleets/corporate_lending/
  tiers:
  - tier_id: originations
    name: Originations
    description: Offer, underwriting, facility setup
    rack_ids: [origination, underwriting]
    bian_service_domains: [Customer Offer, Credit Management, Credit Facility, Corporate Loan, Collateral Asset Administration, Limit And Exposure Management]
  - tier_id: servicing
    name: Servicing
    description: Drawdown, repayment, amendments
    rack_ids: [servicing, amendments]
    bian_service_domains: [Corporate Loan, Credit Facility, Payment Order, Payment Execution, Limit And Exposure Management]
  - tier_id: syndicated
    name: Syndicated
    description: Multi-lender coordination
    rack_ids: [syndication]
    bian_service_domains: [Syndicated Loan, Credit Facility, Limit And Exposure Management, Payment Execution]
  racks:
  - rack_id: origination
    name: Corporate Origination
    description: New facility origination
    bian_service_domains: [Customer Offer, Credit Management, Credit Facility, Corporate Loan, Collateral Asset Administration]
    tier_ids: [originations]
  - rack_id: underwriting
    name: Underwriting
    description: Credit assessment and limits
    bian_service_domains: [Credit Management, Limit And Exposure Management, Collateral Asset Administration]
    tier_ids: [originations]
  - rack_id: servicing
    name: Facility Servicing
    description: Ongoing facility administration
    bian_service_domains: [Corporate Loan, Credit Facility, Payment Order, Payment Execution]
    tier_ids: [servicing]
  - rack_id: amendments
    name: Amendments
    description: Restructuring and amendments
    bian_service_domains: [Corporate Loan, Credit Facility, Limit And Exposure Management]
    tier_ids: [servicing]
  - rack_id: syndication
    name: Syndication
    description: Syndicated loan agent and participation
    bian_service_domains: [Syndicated Loan, Credit Facility, Limit And Exposure Management, Payment Execution]
    tier_ids: [syndicated]

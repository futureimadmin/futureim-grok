fleets:
- fleet_id: investments
  name: Investments & Wealth
  description: 'Investment accounts, portfolio planning/analysis/management, and trading workbench capabilities aligned to BIAN Investment domains.'
  icon: "📈"
  status: active
  platform: bian
  bian_version: "12"
  is_reference: false
  reference_fleet_id: bian
  default_top_k: 8
  system_prompt_hint: Align to BIAN investment structure; product suitability rules stay in product RAG.
  documents_prefix: fleets/investments/
  tiers:
  - tier_id: planning
    name: Planning & Analysis
    description: IPS, allocation, analysis
    rack_ids: [planning, analysis]
    bian_service_domains: [Investment Portfolio Planning, Investment Portfolio Analysis, Customer Offer]
  - tier_id: accounts
    name: Accounts & Holdings
    description: Investment account structures
    rack_ids: [accounts]
    bian_service_domains: [Investment Account]
  - tier_id: markets
    name: Markets
    description: Portfolio management and trading
    rack_ids: [management, trading]
    bian_service_domains: [Investment Portfolio Management, eTrading Workbench]
  racks:
  - rack_id: planning
    name: Portfolio Planning
    description: Goals and allocation models
    bian_service_domains: [Investment Portfolio Planning, Customer Offer]
    tier_ids: [planning]
  - rack_id: analysis
    name: Portfolio Analysis
    description: Risk and performance analysis
    bian_service_domains: [Investment Portfolio Analysis]
    tier_ids: [planning]
  - rack_id: accounts
    name: Investment Accounts
    description: Custody and cash structures
    bian_service_domains: [Investment Account]
    tier_ids: [accounts]
  - rack_id: management
    name: Portfolio Management
    description: Rebalancing and corporate actions
    bian_service_domains: [Investment Portfolio Management, Investment Account]
    tier_ids: [markets]
  - rack_id: trading
    name: Trading Workbench
    description: Order routing
    bian_service_domains: [eTrading Workbench, Investment Portfolio Management]
    tier_ids: [markets]

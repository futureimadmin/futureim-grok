        rack_ids: [mortgages, personal_loans]
        bian_service_domains: [Customer Offer, Credit Management, Loan, Mortgage Loan, Collateral Asset Administration]
      - tier_id: servicing
        name: Servicing
        rack_ids: [collections]
        bian_service_domains: [Loan, Payment Order, Payment Execution]
    racks:
      - rack_id: mortgages
        name: Mortgages
        description: Mortgage origination and servicing.
        bian_service_domains: [Mortgage Loan, Credit Management, Collateral Asset Administration, Customer Offer]
        tier_ids: [originations]
      - rack_id: personal_loans
        name: Personal Loans
        description: Unsecured consumer credit.
        bian_service_domains: [Loan, Credit Management, Customer Offer]
        tier_ids: [originations]
      - rack_id: collections
        name: Collections
        description: Delinquency and recovery handoff.
        bian_service_domains: [Loan, Payment Execution]
        tier_ids: [servicing]


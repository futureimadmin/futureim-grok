# RAG Fleet Registry — 3D logical model (Fleet / Rack / Tier)
# BIAN is the base platform for banking fleets. Volume is not a design limit.

bian_version_default: "12"

fleets:

  - fleet_id: bian
    name: BIAN Reference
    description: >
      Banking Industry Architecture Network — canonical service domains,
      business objects, and service operations. Base platform for banking fleets.
    icon: "🏦"
    status: active
    platform: bian
    bian_version: "12"
    is_reference: true
    reference_fleet_id: null
    default_top_k: 12
    documents_prefix: fleets/bian/
    system_prompt_hint: >
      You are a BIAN architecture specialist. Prefer official BIAN service domain
      and business object names. Align APIs to BIAN control-record style operations.
    tiers:
      - tier_id: sales_servicing
        name: Sales & Servicing
        rack_ids: [customer_offer, party_reference, current_account]
        bian_service_domains: [Customer Offer, Party Reference Data Directory, Current Account]
      - tier_id: lending
        name: Lending
        rack_ids: [loan, mortgage_loan, credit_management, collateral]
        bian_service_domains: [Loan, Mortgage Loan, Credit Management, Collateral Asset Administration]
      - tier_id: payments
        name: Payments
        rack_ids: [payment_order, payment_execution]
        bian_service_domains: [Payment Order, Payment Execution]
    racks:
      - rack_id: loan
        name: Loan
        bian_service_domains: [Loan]
        tier_ids: [lending]
      - rack_id: mortgage_loan
        name: Mortgage Loan
        bian_service_domains: [Mortgage Loan, Collateral Asset Administration]
        tier_ids: [lending]
      - rack_id: credit_management
        name: Credit Management
        bian_service_domains: [Credit Management]
        tier_ids: [lending]
      - rack_id: collateral
        name: Collateral
        bian_service_domains: [Collateral Asset Administration]
        tier_ids: [lending]
      - rack_id: customer_offer
        name: Customer Offer
        bian_service_domains: [Customer Offer]
        tier_ids: [sales_servicing]
      - rack_id: party_reference
        name: Party Reference
        bian_service_domains: [Party Reference Data Directory]
        tier_ids: [sales_servicing]
      - rack_id: current_account
        name: Current Account
        bian_service_domains: [Current Account]
        tier_ids: [sales_servicing]
      - rack_id: payment_order
        name: Payment Order
        bian_service_domains: [Payment Order]
        tier_ids: [payments]
      - rack_id: payment_execution
        name: Payment Execution
        bian_service_domains: [Payment Execution]
        tier_ids: [payments]


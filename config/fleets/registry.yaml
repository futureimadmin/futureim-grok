# RAG Fleet Registry
# Each fleet is an isolated domain knowledge system.
# Racks are subdomains used for finer retrieval scoping and UI navigation.

fleets:
  - fleet_id: consumer_lending
    name: Consumer Lending
    description: Personal loans, credit cards, mortgages, and consumer credit products.
    icon: "💳"
    status: active
    default_top_k: 8
    documents_prefix: fleets/consumer_lending/
    system_prompt_hint: "You are a consumer lending specialist. Cite product terms, rates, and eligibility carefully."
    racks:
      - rack_id: personal_loans
        name: Personal Loans
        description: Unsecured personal loan products, eligibility, underwriting rules.
      - rack_id: mortgages
        name: Mortgages
        description: Home loans, LTV, rate sheets, documentation requirements.
      - rack_id: credit_cards
        name: Credit Cards
        description: Card products, rewards, fees, dispute processes.
      - rack_id: collections
        name: Collections & Delinquency
        description: Collections playbooks, hardship programs, regulatory constraints.

  - fleet_id: customer_relationship
    name: Customer Relationship
    description: CRM knowledge, service scripts, retention, and customer lifecycle.
    icon: "🤝"
    status: active
    default_top_k: 8
    documents_prefix: fleets/customer_relationship/
    system_prompt_hint: "You support customer relationship teams. Be empathetic and policy-accurate."
    racks:
      - rack_id: onboarding
        name: Onboarding
        description: KYC, welcome journeys, first-90-day playbooks.
      - rack_id: service
        name: Service & Support
        description: Support macros, escalation paths, SLA definitions.
      - rack_id: retention
        name: Retention & Win-back
        description: Churn plays, offers, loyalty programs.
      - rack_id: complaints
        name: Complaints & Ombudsman
        description: Complaint handling, regulatory reporting, root-cause.

  - fleet_id: insurance
    name: Insurance
    description: Underwriting, claims, policies, and insurance product knowledge.
    icon: "🛡️"
    status: active
    default_top_k: 10
    documents_prefix: fleets/insurance/
    system_prompt_hint: "You are an insurance domain assistant. Never invent coverage; always cite policy language."
    racks:
      - rack_id: underwriting
        name: Underwriting
        description: Risk guidelines, rating factors, referral rules.
      - rack_id: claims
        name: Claims
        description: FNOL, adjudication, fraud indicators, settlement.
      - rack_id: policies
        name: Policies & Wordings
        description: Policy wordings, endorsements, exclusions.
      - rack_id: reinsurance
        name: Reinsurance
        description: Treaty terms, facultative placements, recoveries.

  - fleet_id: supply_chain
    name: Supply Chain
    description: Procurement, logistics, inventory, and vendor management.
    icon: "📦"
    status: active
    default_top_k: 8
    documents_prefix: fleets/supply_chain/
    system_prompt_hint: "You assist supply-chain operations. Prefer precise SKUs, lead times, and SLAs."
    racks:
      - rack_id: procurement
        name: Procurement
        description: Sourcing, RFQs, contract templates, preferred vendors.
      - rack_id: logistics
        name: Logistics
        description: Shipping modes, Incoterms, carrier SLAs, tracking.
      - rack_id: inventory
        name: Inventory
        description: Safety stock, warehouse ops, cycle counts.
      - rack_id: vendors
        name: Vendor Management
        description: Onboarding, scorecards, risk and compliance.

  - fleet_id: sales_marketing
    name: Sales & Marketing
    description: Product messaging, battlecards, campaigns, and sales enablement.
    icon: "📈"
    status: active
    default_top_k: 8
    documents_prefix: fleets/sales_marketing/
    system_prompt_hint: "You support sales and marketing. Stay on-brand and fact-check competitive claims."
    racks:
      - rack_id: enablement
        name: Sales Enablement
        description: Battlecards, objection handling, demo scripts.
      - rack_id: campaigns
        name: Campaigns
        description: Campaign briefs, channel playbooks, attribution.
      - rack_id: product_marketing
        name: Product Marketing
        description: Positioning, messaging frameworks, launch kits.
      - rack_id: competitive
        name: Competitive Intelligence
        description: Competitor briefs, win/loss insights.

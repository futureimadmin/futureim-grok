<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/console.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">RAG Fleet Console</div>
      <nav>
        <a href="/">Console</a>
        <a href="/dashboard">Accuracy Dashboard</a>
        <a href="/admin">Admin</a>
      </nav>
      <h3>Fleets</h3>
      <div id="fleet-list" class="fleet-list"></div>
      <h3>Racks</h3>
      <div id="rack-list" class="rack-list"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1>Query</h1>
        <p class="muted">Scoped by fleet / rack · hybrid retrieval · citations</p>
      </header>
      <div id="chat" class="chat"></div>
      <div class="composer">
        <textarea id="query" rows="2" placeholder="Ask about this fleet or rack…"></textarea>
        <button id="send" class="btn primary">Send</button>
      </div>
    </main>
  </div>
  <script src="/static/console.js"></script>
</body>
</html>
